# ineermostwords.sigborn.xyz — 心语宣传页
# 部署位置: /www/server/panel/vhost/nginx/ineermostwords.conf
# 站点目录: /var/www/ineermostwords（源: 仓库 website/ 目录）
# 证书: Let's Encrypt；续期后由 /etc/letsencrypt/renewal-hooks/deploy/ineermostwords-sync.sh 同步

server {
    listen 80;
    server_name ineermostwords.sigborn.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/ineermostwords;
    }


    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ineermostwords.sigborn.xyz;

    # 页面访问量日志（只记 text/html，供 intro 管理展板统计）
    access_log /var/log/sigborn-stats/ineermostwords.log sigborn_stats if=$sigborn_pageview;

    root /var/www/ineermostwords;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/ssl/ineermostwords.sigborn.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/ssl/ineermostwords.sigborn.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 下载跳转（302 到发布页，单独记录下载日志，见 intro 管理展板）
    access_log /var/log/sigborn-stats/downloads.log sigborn_stats if=$sigborn_download;

    location = /dl/github {
        return 302 https://github.com/adcoof/ineermost_words/releases/download/v2.1.0/app-release.apk;
    }

    location = /dl/gitee {
        return 302 https://gitee.com/phantexdream/ineermost_words/releases/download/v2.1.0/app-release.apk;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security max-age=31536000 always;
}
